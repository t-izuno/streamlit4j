name: Security scan (weekly)

on:
  schedule:
    # 毎週月曜 00:00 UTC（= 月曜 09:00 JST）
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compute weekly cache key suffix
        id: cache-key
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            dependency-check-data-
      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -P security-scan -DnvdApiKey="$NVD_API_KEY" -DskipTests verify
      - name: Upload HTML / SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.sarif
          if-no-files-found: ignore
      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
        continue-on-error: true
